<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914">
<title>CAT EARTH — Your cats, on Earth</title>
<style>
:root{color-scheme:dark;--bg:#050914;--panel:#101a2b;--muted:#91a0b8;--line:#26344a;--accent:#9bd8ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#12233b 0,#07101e 48%,#03060d 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f8ff}button,input,textarea{font:inherit}#app{height:100dvh;min-height:520px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);max-width:760px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 3px 6px;z-index:2}.brand{font-weight:800;letter-spacing:.16em;font-size:13px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.pill{border:1px solid var(--line);background:#101a2bcc;border-radius:99px;padding:8px 11px;color:#cfe8ff;font-size:11px}.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.globe-wrap{width:min(92vw,620px,calc(100dvh - 240px));aspect-ratio:1;max-height:100%;position:relative;flex:none;transform:translateY(-2px)}#globeViz{position:absolute;inset:0;width:100%;height:100%}#globeViz canvas{display:block;max-width:100%;max-height:100%;outline:none}.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#8fa4c1;font-size:11px;pointer-events:none}.counter{position:absolute;top:12px;left:10px;background:#0b1424bd;border:1px solid #26364c;border-radius:14px;padding:9px 12px;font-size:11px;color:#b9cce4;backdrop-filter:blur(12px)}.counter b{font-size:17px;color:white;display:block;margin-bottom:2px}.bottom{z-index:3;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#050914 24%)}.actions{display:flex;gap:9px;justify-content:center;margin-bottom:10px}.btn{border:1px solid #30425c;background:#15243a;color:#eaf5ff;border-radius:14px;padding:12px 15px;font-weight:650;font-size:13px}.btn.primary{background:#d9efff;color:#07111d;border-color:#d9efff}.btn:disabled{opacity:.55}.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #1c2a3d;padding-top:9px}.nav button{background:none;border:0;color:#71839d;font-size:10px;padding:5px 0}.nav button span{display:block;font-size:18px;margin-bottom:4px}.nav button.active{color:#d9efff}.modal{position:fixed;inset:0;background:#020711b8;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modal.show{display:flex}.sheet{width:min(100%,520px);background:#101b2c;border:1px solid #2a3b54;border-radius:24px 24px 18px 18px;padding:18px;max-height:85dvh;overflow:auto}.sheet h2{font-size:18px;margin:0 0 6px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.field{display:block;margin-top:13px;font-size:12px;color:#b9cce4}.field input,.field textarea{width:100%;margin-top:6px;background:#081321;border:1px solid #30415a;border-radius:12px;color:white;padding:12px;outline:none}.field textarea{min-height:72px;resize:vertical}.preview{width:100%;max-height:190px;object-fit:contain;border-radius:14px;margin-top:12px;background:#07101d}.location{margin-top:12px;padding:11px;border-radius:12px;background:#0a1525;border:1px solid #27374d;font-size:12px;color:#bcd4ee}.row{display:flex;gap:9px;margin-top:16px}.row .btn{flex:1}.catpin{font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px #000);cursor:pointer;user-select:none}.empty{color:#8fa4c1;font-size:12px;text-align:center;max-width:220px;line-height:1.6}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#d9efff;color:#07111d;border-radius:99px;padding:10px 15px;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}
@media(min-width:700px){#app{border-left:1px solid #17243a;border-right:1px solid #17243a}.globe-wrap{width:min(66vw,620px,calc(100dvh - 230px))}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div><div class="brand">✦ CAT EARTH</div><div class="sub">Every cat has a place in your world.</div></div><div class="pill" id="gpsStatus">GPS · 待开启</div></header>
<main class="stage"><div class="counter"><b id="catCount">0</b>只已收藏的猫咪</div><div class="globe-wrap"><div id="globeViz"></div></div><div class="hint">拖动旋转地球 · 双指缩放 · 点击猫咪查看记录</div></main>
<footer class="bottom"><div class="actions"><button class="btn primary" id="addCat">＋ 记录一只猫</button><button class="btn" id="myLocation">◎ 定位我</button></div><nav class="nav"><button class="active"><span>🌍</span>地球</button><button id="explore"><span>⌕</span>探索</button><button id="navAdd"><span>📷</span>拍摄</button><button id="collection"><span>🐾</span>收藏</button><button id="profile"><span>◉</span>我的</button></nav></footer>
</div>
<div class="modal" id="editor"><section class="sheet"><h2>添加一只猫咪 🐈</h2><p class="muted">选择照片后，CAT EARTH 会请求 GPS 权限，并将位置和猫咪记录一起保存到这台设备。</p><label class="field">猫咪照片<input type="file" id="photo" accept="image/*" capture="environment"></label><img id="preview" class="preview" hidden alt="猫咪照片预览"><label class="field">猫咪名字<input id="catName" maxlength="30" placeholder="例如：小橘、Lucky"></label><label class="field">Memo / 遇见故事<textarea id="memo" maxlength="500" placeholder="在哪里遇见它？它有什么特别之处？"></textarea></label><div class="location" id="locationInfo">📍 尚未取得位置。上传照片后会尝试自动定位。</div><div class="row"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save" disabled>保存猫咪记录</button></div></section></div>
<div class="modal" id="detail"><section class="sheet"><h2 id="detailName">猫咪记录</h2><img id="detailPhoto" class="preview" alt="猫咪照片"><p class="muted" id="detailMemo"></p><div class="location" id="detailLocation"></div><div class="row"><button class="btn" id="deleteCat">删除记录</button><button class="btn primary" id="closeDetail">关闭</button></div></section></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/globe.gl"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let globe=null,records=[],selectedId=null,currentCoords=null,photoData=null;
const DB='cat-earth-db-v2',STORE='cats';
function toast(s){const el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600)}
function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbAll(){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function dbPut(item){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function dbDelete(id){const db=await dbOpen();return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function locate(){return new Promise((resolve,reject)=>{if(!('geolocation'in navigator)){reject(new Error('此浏览器不支持 GPS'));return}navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy)}),e=>reject(e),{enableHighAccuracy:true,timeout:12000,maximumAge:0})})}
async function refreshLocation(){ $('gpsStatus').textContent='GPS · 定位中';try{currentCoords=await locate();$('gpsStatus').textContent='GPS · 已定位';$('locationInfo').textContent=`📍 ${currentCoords.lat.toFixed(5)}, ${currentCoords.lng.toFixed(5)} · 精度约 ${currentCoords.accuracy} 米`;return currentCoords}catch(e){$('gpsStatus').textContent='GPS · 未授权';$('locationInfo').textContent='⚠️ 无法取得位置：请检查 Safari 的定位权限，并确认网站使用 HTTPS。此记录暂时不能保存坐标。';throw e}}
function markerElement(d){const el=document.createElement('div');el.className='catpin';el.textContent='🐱';el.title=d.name||'猫咪';el.style.transform='translate(-50%,-50%)';el.addEventListener('click',e=>{e.stopPropagation();showDetail(d.id)});return el}
function renderMarkers(){if(!globe)return;globe.htmlElementsData(records.filter(r=>Number.isFinite(r.lat)&&Number.isFinite(r.lng))).htmlLat(d=>d.lat).htmlLng(d=>d.lng).htmlAltitude(0.018).htmlElement(markerElement).htmlElementVisibility(()=>true);$('catCount').textContent=records.length}
async function init(){records=await dbAll();$('catCount').textContent=records.length;if(typeof Globe!=='function'){$('globeViz').innerHTML='<div class="empty">地球组件加载失败。请检查网络连接后重新载入。</div>';return}
const host=$('globeViz');const w=host.clientWidth||320;const h=host.clientHeight||320;
globe=Globe()(host).width(w).height(h).backgroundColor('rgba(0,0,0,0)').globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').showAtmosphere(true).atmosphereColor('#5aaeff').atmosphereAltitude(0.12).htmlElementsData([]).htmlLat(d=>d.lat).htmlLng(d=>d.lng).htmlAltitude(0.018).htmlElement(markerElement).htmlElementVisibility(()=>true).enablePointerInteraction(true);
const controls=globe.controls();controls.autoRotate=true;controls.autoRotateSpeed=.28;controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=globe.getGlobeRadius()*1.35;controls.maxDistance=globe.getGlobeRadius()*4.5;
// Limit pixel ratio to reduce GPU load on high-density phones.
const renderer=globe.renderer();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));globe.pointOfView({lat:15,lng:15,altitude:2.4},0);renderMarkers();
let resizeTimer;const ro=new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const ww=host.clientWidth,hh=host.clientHeight;if(ww>0&&hh>0)globe.width(ww).height(hh)},100)});ro.observe(host);
}
function openEditor(){photoData=null;currentCoords=null;$('photo').value='';$('preview').hidden=true;$('catName').value='';$('memo').value='';$('save').disabled=true;$('locationInfo').textContent='📍 选择照片后会尝试自动获取 GPS。';$('editor').classList.add('show')}
$('photo').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){toast('请选择图片文件');return}const reader=new FileReader();reader.onload=()=>{photoData=reader.result;$('preview').src=photoData;$('preview').hidden=false};reader.readAsDataURL(f);$('locationInfo').textContent='📍 正在请求手机定位权限…';try{await refreshLocation();$('save').disabled=false}catch(err){$('save').disabled=true;toast('定位失败：暂时无法保存带坐标的记录')}});
$('save').addEventListener('click',async()=>{if(!photoData||!currentCoords){toast('需要照片和 GPS 坐标才能保存');return}const item={id:crypto.randomUUID(),name:$('catName').value.trim()||'未命名猫咪',memo:$('memo').value.trim(),photo:photoData,lat:currentCoords.lat,lng:currentCoords.lng,accuracy:currentCoords.accuracy,locationSource:'gps',createdAt:new Date().toISOString()};try{await dbPut(item);records.push(item);renderMarkers();$('editor').classList.remove('show');toast('猫咪记录已保存到地球上 🐾')}catch(e){toast('保存失败，请检查设备储存空间')}});
function showDetail(id){const r=records.find(x=>x.id===id);if(!r)return;selectedId=id;$('detailName').textContent=r.name;$('detailPhoto').src=r.photo;$('detailMemo').textContent=r.memo||'还没有写下遇见故事。';$('detailLocation').textContent=`📍 纬度 ${r.lat.toFixed(5)} · 经度 ${r.lng.toFixed(5)}\nGPS 精度约 ${r.accuracy} 米 · ${new Date(r.createdAt).toLocaleString()}`;$('detail').classList.add('show')}
$('deleteCat').onclick=async()=>{if(!selectedId)return;await dbDelete(selectedId);records=records.filter(x=>x.id!==selectedId);renderMarkers();$('detail').classList.remove('show');toast('记录已删除')};$('closeDetail').onclick=()=>$('detail').classList.remove('show');$('cancel').onclick=()=>$('editor').classList.remove('show');$('addCat').onclick=openEditor;$('navAdd').onclick=openEditor;$('myLocation').onclick=async()=>{try{const p=await locate();globe.pointOfView({lat:p.lat,lng:p.lng,altitude:1.8},1200);$('gpsStatus').textContent='GPS · 已定位';toast('已定位到你附近')}catch(e){toast('无法定位，请检查浏览器权限和 HTTPS')}};
$('collection').onclick=()=>{if(!records.length){toast('还没有收藏猫咪，先记录第一只吧');return}const r=records[records.length-1];globe.pointOfView({lat:r.lat,lng:r.lng,altitude:1.7},1000);showDetail(r.id)};
$('explore').onclick=()=>toast('探索功能将在下一阶段加入');$('profile').onclick=()=>toast('个人资料功能将在下一阶段加入');
init().catch(e=>{console.error(e);toast('初始化失败，请重新载入页面')});
})();
</script>
</body></html>
